[package]
name = "kmeans_uni"
version = "0.2.0"
authors = ["Denis Avvakumov"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Deniskore/kmeans_uni"
homepage = "https://github.com/Deniskore"
edition = "2024"
description = "Fast, safe K-Means++ with SIMD acceleration, mini-batch training and WASM support."
categories = ["algorithms", "science", "mathematics"]
keywords = ["kmeans", "clustering", "machine-learning"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wide"]
wide = ["dep:wide"]
serde = ["dep:serde"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
bytemuck = "1.25.0"
cfg-if = "1.0.4"
num-traits = "0.2.19"
rand = "0.10.1"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
rayon = "1.12.0"
thiserror = "2.0.18"
wide = { version = "1.3.0", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
wasm-bindgen = { version = "0.2.120", optional = true }
js-sys = { version = "0.3.97", optional = true }

[dev-dependencies]
linfa = "0.8.1"
linfa-clustering = "0.8.1"
linfa-nn = "0.8.1"
ndarray = "0.16.1"
rand08 = { package = "rand", version = "0.8.6" }
divan = "0.1.21"
memmap2 = "0.9.9"
tempfile = "3.27.0"

[[bench]]
name = "kmeans_bench"
harness = false
